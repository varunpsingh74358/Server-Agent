name: Build CloudOrc Agent Installer

# CI validation (build + test + build installer, no GitHub Release) runs on every push to
# main and every PR into main. A GitHub Release with CloudOrcAgentSetup.exe is only
# created when a `v*` tag is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Minimum permission needed: `contents: write` only, so the release job can create a
# GitHub Release and upload assets using the built-in GITHUB_TOKEN. No personal access
# token is used or required.
permissions:
  contents: write

env:
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  ISCC_PATH: C:\Program Files (x86)\Inno Setup 6\ISCC.exe

jobs:
  build-installer:
    name: Build, test, and package installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Target framework across every project in this solution is net10.0-windows.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet restore
        run: dotnet restore CloudOrc.WindowsAgents.sln

      - name: dotnet build (Release)
        run: dotnet build CloudOrc.WindowsAgents.sln -c Release --no-restore

      - name: dotnet test
        run: dotnet test CloudOrc.WindowsAgents.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish both agents (self-contained win-x64)
        shell: pwsh
        # Tests already ran as their own step above - skip re-running them here. This
        # reuses the existing package-agent.ps1 (dotnet publish + verification) rather
        # than duplicating publish logic in the workflow.
        run: ./scripts/package-agent.ps1 -SkipTests

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path $env:ISCC_PATH)) {
            Write-Host "Inno Setup not found at expected path - downloading and installing it."
            $installerPath = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installerPath -UseBasicParsing
            Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }
          if (-not (Test-Path $env:ISCC_PATH)) {
            throw "ISCC.exe still not found after install attempt at $env:ISCC_PATH"
          }
          Write-Host "Inno Setup compiler found at $env:ISCC_PATH"

      - name: Determine installer version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag" -and $tag -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0-dev"
          }
          Write-Host "Installer version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build CloudOrcAgentSetup.exe
        shell: pwsh
        run: |
          & $env:ISCC_PATH "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\CloudOrcAgentSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit code $LASTEXITCODE" }

      - name: Verify installer output
        shell: pwsh
        run: |
          $exe = "installer\Output\CloudOrcAgentSetup.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if ((Get-Item $exe).Length -le 0) { throw "$exe is empty" }
          Write-Host "Installer verified: $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $exe = "installer\Output\CloudOrcAgentSetup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          "$hash  CloudOrcAgentSetup.exe" | Set-Content -Path "installer\Output\CloudOrcAgentSetup.exe.sha256" -NoNewline -Encoding ascii
          Write-Host "SHA256: $hash"

      # Uploaded on every run (including plain pushes/PRs to main) purely as a
      # downloadable CI artifact for inspection/testing - this is NOT a GitHub Release.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudOrcAgentSetup
          path: |
            installer\Output\CloudOrcAgentSetup.exe
            installer\Output\CloudOrcAgentSetup.exe.sha256
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-installer
    runs-on: windows-latest
    # Only ever runs for a version tag push - never for a plain push to main or a PR.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudOrcAgentSetup
          path: installer-output

      - name: Create GitHub Release and upload assets
        shell: pwsh
        # Uses the GitHub CLI (preinstalled on GitHub-hosted Windows runners) with the
        # built-in GITHUB_TOKEN - no personal access token is used or required.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "installer-output/CloudOrcAgentSetup.exe" `
            "installer-output/CloudOrcAgentSetup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --title "CloudOrc Agent $tag" `
            --generate-notes
